<script>
/* ---- Applying Bootswatch Themes: Shiny ----
 * Marker slide: .btd-slide   Stage container: #btd-stage
 * Same TM.gate/TM.anime architecture as brand-deconstructed.js. That slide
 * explodes a CSS-variable-driven mockup into four planes; this one has
 * nothing to re-skin — the four states are real Shiny screenshots — so
 * instead of planes it crossfades <img>s, and instead of a 4-way code
 * explode it crossfades two code states (no theme line / theme line),
 * swapping just the preset name+color between vapor/minty/sketchy.
 * Reuses infra.html's TM.gate / TM.anime, and copies the codewindow chrome
 * + custom-highlighting passes from brand-deconstructed.js unchanged so
 * this panel matches the rest of the deck's R syntax highlighting.
 */
(function () {
  const THEMES = [
    { id: 'default', label: 'Default', img: 'inst/img/default-theme-shiny.jpeg', hasTheme: false },
    { id: 'vapor',   label: 'Vapor',   img: 'inst/img/vapor-theme-shiny.jpeg',   hasTheme: true, strColor: '#f472b6', flash: 'rgba(244,114,182,.16)' },
    { id: 'minty',   label: 'Minty',   img: 'inst/img/minty-theme-shiny.jpeg',   hasTheme: true, strColor: '#5fd9b8', flash: 'rgba(95,217,184,.18)' },
    { id: 'sketchy', label: 'Sketchy', img: 'inst/img/sketchy-theme-shiny.jpeg', hasTheme: true, strColor: '#fbbf24', flash: 'rgba(251,191,36,.18)' },
  ];

  // Copied verbatim from _extensions/emilhvitfeldt/codewindow/codewindow.js —
  // see brand-deconstructed.js for why this panel can't rely on
  // RevealCodewindow's own one-time DOM rewrite.
  const MAC_BUTTONS_SVG = `<svg viewBox="0 0 420 100" style="width:55px"><circle fill="#ff5f57" cx="50" cy="50" r="50"/><circle fill="#febc2e" cx="210" cy="50" r="50"/><circle fill="#28c840" cx="370" cy="50" r="50"/></svg>`;
  const R_ICON_SVG = `<svg viewBox="0 0 724 561" style="height:1em"><path d="M361.453,485.937 C162.329,485.937 0.906,377.828 0.906,244.469 C0.906,111.109 162.329,3.000 361.453,3.000 C560.578,3.000 722.000,111.109 722.000,244.469 C722.000,377.828 560.578,485.937 361.453,485.937 ZM416.641,97.406 C265.289,97.406 142.594,171.314 142.594,262.484 C142.594,353.654 265.289,427.562 416.641,427.562 C567.992,427.562 679.687,377.033 679.687,262.484 C679.687,147.971 567.992,97.406 416.641,97.406 Z" fill="#a9a8ad" fill-rule="evenodd"/><path d="M550.000,377.000 C550.000,377.000 571.822,383.585 584.500,390.000 C588.899,392.226 596.510,396.668 602.000,402.500 C607.378,408.212 610.000,414.000 610.000,414.000 L696.000,559.000 L557.000,559.062 L492.000,437.000 C492.000,437.000 478.690,414.131 470.500,407.500 C463.668,401.969 460.755,400.000 454.000,400.000 C449.298,400.000 420.974,400.000 420.974,400.000 L421.000,558.974 L298.000,559.026 L298.000,152.938 L545.000,152.938 C545.000,152.938 657.500,154.967 657.500,262.000 C657.500,369.033 550.000,377.000 550.000,377.000 ZM496.500,241.024 L422.037,240.976 L422.000,310.026 L496.500,310.002 C496.500,310.002 531.000,309.895 531.000,274.877 C531.000,239.155 496.500,241.024 496.500,241.024 Z" fill="rgb(39,109,195)" fill-rule="evenodd"/></svg>`;

  // ---- direct copy of brand-deconstructed.js's port of
  // postprocess_code_highlighting.R — unchanged, so any code panel this
  // deck builds in the browser (instead of through Pandoc + the R
  // post-render step) gets the same namespace/hex/bracket treatment. ----
  const BRACKET_COLORS = ["#ed90a4", "#d3a263", "#99b657", "#33c192", "#00bdce", "#94a9ec", "#dc91db"];
  const NAMESPACE_COLOR = "#FFCC66";
  const HEX_PATTERN = /#(?:[0-9A-Fa-f]{3}){1,2}\b/g;
  const OPEN_BRACKETS = "([{";
  const CLOSE_BRACKETS = ")]}";

  function contrastingTextColor(hex) {
    hex = hex.replace(/^#/, "");
    if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
    const channels = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16) / 255);
    const linear = channels.map(c => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
    const luminance = linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722;
    return luminance > 0.5 ? "#1a1a1a" : "#ffffff";
  }
  function textNodesIn(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);
    return nodes;
  }
  function replaceWithHtml(node, html) {
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    node.replaceWith(...tpl.content.childNodes);
  }
  function addHexPills(codeEl) {
    textNodesIn(codeEl).forEach(tn => {
      const txt = tn.nodeValue;
      if (!HEX_PATTERN.test(txt)) return;
      HEX_PATTERN.lastIndex = 0;
      let cursor = 0, out = "", m;
      while ((m = HEX_PATTERN.exec(txt))) {
        out += txt.slice(cursor, m.index);
        const hex = m[0];
        out += `<span class="hex-pill" style="background-color:${hex};color:${contrastingTextColor(hex)};">${hex}</span>`;
        cursor = m.index + hex.length;
      }
      out += txt.slice(cursor);
      replaceWithHtml(tn, out);
    });
  }
  function addRainbowBrackets(codeEl) {
    let depth = 0;
    textNodesIn(codeEl).forEach(tn => {
      const txt = tn.nodeValue;
      if (!/[()[\]{}]/.test(txt)) return;
      let out = "";
      for (const ch of txt) {
        if (OPEN_BRACKETS.includes(ch)) {
          depth += 1;
          out += `<span class="bracket-depth" style="color:${BRACKET_COLORS[(depth - 1) % BRACKET_COLORS.length]};">${ch}</span>`;
        } else if (CLOSE_BRACKETS.includes(ch)) {
          out += `<span class="bracket-depth" style="color:${BRACKET_COLORS[(Math.max(depth, 1) - 1) % BRACKET_COLORS.length]};">${ch}</span>`;
          depth = Math.max(depth - 1, 0);
        } else {
          out += ch;
        }
      }
      replaceWithHtml(tn, out);
    });
  }
  function addNamespaceColoring(codeEl) {
    codeEl.querySelectorAll("span.sc").forEach(sc => {
      if (sc.textContent !== "::") return;
      let prev = sc.previousSibling;
      while (prev && prev.nodeType !== Node.TEXT_NODE) prev = prev.previousSibling;
      if (!prev) return;
      const txt = prev.nodeValue;
      const m = txt.match(/[A-Za-z0-9._]+\s*$/);
      if (!m) return;
      const pkgWithWs = m[0];
      const pkg = pkgWithWs.trim();
      const prefix = txt.slice(0, txt.length - pkgWithWs.length);
      const trailingWs = pkgWithWs.slice(pkg.length);
      replaceWithHtml(prev, `${prefix}<span class="namespace" style="color:${NAMESPACE_COLOR};">${pkg}</span>${trailingWs}`);
    });
  }
  function applyCustomHighlighting(codeEl) {
    addNamespaceColoring(codeEl);
    addHexPills(codeEl);
    addRainbowBrackets(codeEl);
  }

  // ---- the two code states (same content as the qmd's original two
  // `.editor` fragments) — built once, then crossfaded + the preset name
  // swapped by JS instead of relying on RevealCodewindow's own fragments. --
  const CODE_PLAIN = `bslib<span class="sc">::</span><span class="gd-fn">page_navbar</span>(
  title = <span class="gd-str">"Dashboard"</span>,
  bslib<span class="sc">::</span><span class="gd-fn">nav_panel</span>(...)
)`;

  const CODE_THEMED = `bslib<span class="sc">::</span><span class="gd-fn">page_navbar</span>(
  title = <span class="gd-str">"Dashboard"</span>,
  <span class="btd-theme-line" id="btdThemeLine">theme = bslib<span class="sc">::</span><span class="gd-fn">bs_theme</span>(preset = <span class="gd-str" id="btdPresetStr">"vapor"</span>),</span>
  bslib<span class="sc">::</span><span class="gd-fn">nav_panel</span>(...)
)`;

  let built = false;
  let codePlainEl, codeThemedEl, plainStateEl, themedStateEl, presetStr, themeLine, imgEls;

  function build() {
    const stage = document.getElementById('btd-stage');
    if (!stage || built) return !!stage;
    built = true;

    // -- code panel: same .bd-codewindow chrome as brand-deconstructed.js,
    // two absolutely-stacked states crossfaded instead of four exploded
    // planes.
    const code = document.createElement('div');
    code.className = 'bd-code bd-codewindow bd-codewindow-dark';
    code.setAttribute('data-chrome', 'mac');
    code.innerHTML = `
      <div class="header">
        <div class="buttons">${MAC_BUTTONS_SVG}</div>
        <div class="file active">${R_ICON_SVG}ui.R</div>
      </div>
      <div class="textarea">
        <div class="btd-code-stack">
          <pre id="btdPlainState"><code id="btdCodePlain" class="sourceCode r">${CODE_PLAIN}</code></pre>
          <pre id="btdThemedState"><code id="btdCodeThemed" class="sourceCode r">${CODE_THEMED}</code></pre>
        </div>
      </div>
    `;
    stage.appendChild(code);

    codePlainEl = code.querySelector('#btdCodePlain');
    codeThemedEl = code.querySelector('#btdCodeThemed');
    applyCustomHighlighting(codePlainEl);
    applyCustomHighlighting(codeThemedEl);
    presetStr = code.querySelector('#btdPresetStr');
    themeLine = code.querySelector('#btdThemeLine');
    codePlainEl.style.opacity = 1;
    codeThemedEl.style.opacity = 0;
    plainStateEl = code.querySelector('#btdPlainState');
themedStateEl = code.querySelector('#btdThemedState');
plainStateEl.style.opacity = 1;
themedStateEl.style.opacity = 0;

    // -- preview panel: real screenshots, crossfaded. No CSS-variable
    // mockup layer here — nothing to re-skin, these are actual app
    // screenshots.
    const preview = document.createElement('div');
    preview.id = 'btd-preview';
    preview.innerHTML = THEMES.map(t =>
      `<img class="btd-shot" id="btd-shot-${t.id}" src="${t.img}" alt="Shiny dashboard styled with the ${t.label} theme">`
    ).join('');
    stage.appendChild(preview);
    imgEls = Object.fromEntries(THEMES.map(t => [t.id, document.getElementById('btd-shot-' + t.id)]));

    return true;
  }

  function render(stage) {
    if (!build()) return;
    const theme = THEMES[Math.min(stage, THEMES.length - 1)];

    Object.entries(imgEls).forEach(([id, el]) => el.classList.toggle('btd-on', id === theme.id));

    TM.anime({ targets: codePlainEl, opacity: theme.hasTheme ? 0 : 1, duration: 450, easing: 'easeInOutQuad' });
    TM.anime({ targets: codeThemedEl, opacity: theme.hasTheme ? 1 : 0, duration: 450, easing: 'easeInOutQuad' });

    TM.anime({
  targets: plainStateEl,
  opacity: theme.hasTheme ? 0 : 1,
  duration: 450,
  easing: 'easeInOutQuad'
});

TM.anime({
  targets: themedStateEl,
  opacity: theme.hasTheme ? 1 : 0,
  duration: 450,
  easing: 'easeInOutQuad'
});

    if (theme.hasTheme) {
      presetStr.textContent = `"${theme.id}"`;
      presetStr.style.color = theme.strColor;
      themeLine.style.setProperty('--btd-flash', theme.flash);
      themeLine.classList.remove('btd-flash');
      requestAnimationFrame(() => {
        themeLine.classList.add('btd-flash');
        setTimeout(() => themeLine.classList.remove('btd-flash'), 900);
      });
    }
  }

  TM.gate({
    markerClass: 'btd-slide',
    fragmentIds: ['btd-vapor', 'btd-minty', 'btd-sketchy'],
    render,
  });
})();
</script>
